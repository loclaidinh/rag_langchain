[project]
name = "rag-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.35",
    "dotenv>=0.9.9",
    "langchain-core>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "langchain[openai]>=1.5.0",
    "numpy>=2.4.6",
    "pypdf>=7.0.1",
    "requests>=2.34.2",
]

[project.scripts]
rag-langchain = "rag_langchain:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
